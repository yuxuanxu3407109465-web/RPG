<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封城第七天</title>
<link rel="icon" href="/icons.svg">
<link rel="stylesheet" href="/style.css?v=map3">
</head>
<body>
<!--SPRITE-->
<div id="toast" class="toast hidden"></div>

<!-- ========== 主菜单 ========== -->
<section id="screen-menu" class="screen menu">
  <div class="menu-box">
    <h1 class="title">封城第七天</h1>
    <p class="subtitle">末日生存文字冒险 · 按钮版</p>
    <div class="menu-actions">
      <button class="btn big primary" data-act="new">
        <svg class="ico" aria-hidden="true"><use href="#i-person"></use></svg>
        <span>新游戏</span>
      </button>
      <button class="btn big ghost" id="menu-exit" title="结束游戏并关闭本地服务">
        <svg class="ico" aria-hidden="true"><use href="#i-exit"></use></svg>
        <span>退出游戏</span>
      </button>
    </div>
    <div class="slots" id="menu-slots"></div>
    <p class="hint" id="menu-hint"></p>
  </div>
</section>

<!-- ========== 角色创建 ========== -->
<section id="screen-create" class="screen hidden">
  <div class="create-wrap">
    <header class="bar">
      <h2>创建角色</h2>
      <span class="steps" id="create-steps"></span>
    </header>
    <div class="log" id="create-log"></div>
    <div class="prompt" id="create-prompt"></div>
  </div>
</section>

<!-- ========== 游戏中 ==========
     界面上下一共分六个区域，名字固定，改布局时按名字找（详见 ../界面区域.md）：
       左侧栏    = .side-left       最左边一列，角色卡（等级/生命/负重/属性/战斗/状态）
       视图栏    = .main            中间一列上半，房间栏 + 场景 / 背包 / 技能树三个页签
                                     「场景」= .scene-panel（左边一列地图 + 右边一列场景，上面一行放时钟）
                                     「背包」= 背包面板（翻页、拖动装备、拆分、堆叠）
                                     地图和时钟在场景面板里，切到别的页签会一起收起来
       移动栏    = .move-panel      中间一列下半正中间，四个方向（上下楼点场景里的楼梯格）
       快捷区域1 = #quick-zone-1    移动栏左边那块，装备栏（拖动装备 / 脱下）
       快捷区域2 = #quick-zone-2    移动栏右边那块，文字记录 + 指令输入（固定高度，内部滚动）
       右侧栏    = .side-right      最右边一列，背包快捷栏 / 休息 / 存档读档 / 系统
     每个区域的根元素都带 data-region="区域名"，改哪儿直接搜这个名字。 -->
<section id="screen-play" class="screen hidden">
  <div class="layout">

    <!-- 左侧栏 -->
    <aside class="panel side-left" data-region="左侧栏">
      <div class="panel-head">
        <svg class="ico" aria-hidden="true"><use href="#i-person"></use></svg>
        <h3>角色</h3>
      </div>
      <div class="panel-body" id="char-body"></div>
    </aside>

    <div class="play-col">

      <!-- 视图栏：格子场景，人物在这里走动；点上面的页签换成背包或技能树。
           场景这一页里并排两块（都占排版空间，不重叠）：
             · 左边一列 = 区域地图（当前楼层 + 楼层切换条，app.js 的 renderMap）
             · 右边一列 = 上面时钟（renderClock）、下面格子场景 -->
      <main class="main view-panel" data-region="视图栏">
        <header class="bar room-bar" id="room-bar">
          <h2 id="room-name">—</h2>
          <span class="room-sub" id="room-sub"></span>
          <!-- 说话时房间信息让位给这条横幅（对话框）：显示当前这一句，
               点视图栏任意位置就是「继续」，看下一句。平时它是空的、不占地方。 -->
          <div class="talk-banner hidden" id="talk-banner">
            <span class="talk-speaker" id="talk-speaker"></span>
            <p class="talk-text" id="talk-text"></p>
            <span class="talk-hint" id="talk-hint">点视图栏任意位置继续</span>
          </div>
          <div class="view-tabs" id="view-tabs">
            <button type="button" class="view-tab active" data-view-tab="scene">场景</button>
            <button type="button" class="view-tab" data-view-tab="bag">背包</button>
            <button type="button" class="view-tab" data-view-tab="skills">技能树</button>
          </div>
        </header>
        <!-- 视图栏的「场景」页签 = 左边地图 + 中间场景 + 右边时钟，三块并排、各占一块地方（谁也不压谁）。
             （地图原来是浮在场景上的绝对定位浮层，会盖住几十个能点的格子。）
             左右两块一样宽（都是 --w-map），所以中间的格子场景在**整个视图栏里正中**，地图和时钟一左一右对称。
             整块装在 #scene-panel 里，切到背包 / 技能树页签时连地图和时钟一起收起来，
             不会盖在背包格子和技能树按钮上：
               · 左边一列 = 区域地图（当前这层 + 楼层切换条，可以拖动平移、滚轮缩放）
               · 中间     = 格子场景（颜色图例在里面最下面一条）
               · 右边一列 = 时钟（时间 + 回合数） -->
        <div class="scene-panel" id="scene-panel">
          <!-- 左边：区域地图。当前楼层画成方块（当前房间高亮、出口直接写目的地名字），
               上面一排是这一层和缩放比例，下面一条可以换楼层。整体由 app.js 的 renderMap 画。
               它是一列、不是浮层：多宽多高由 style.css 的 --w-map / --h-map 定死，
               所以换楼层、换建筑地图都不会变大变小 -->
          <div class="view-map" id="view-map" data-region="地图">
            <div class="map-head">
              <span class="map-area" id="map-area">—</span>
              <span class="map-zoom" id="map-zoom"></span>
              <button type="button" class="map-act" id="map-reset" title="回到默认缩放、并把这个地方摆回正中间">复位</button>
            </div>
            <div class="map-viewport" id="map-viewport">
              <div class="map-body" id="map-body"></div>
            </div>
            <div class="map-floors" id="map-floors"></div>
          </div>
          <!-- 中间：格子场景 -->
          <div class="scene-col">
            <div class="scene-wrap" id="scene-body"></div>
          </div>
          <!-- 右边：时钟（时间 + 回合数）。和左边地图同宽的一列，所以场景才是正中的；
               时钟是这一列里的普通元素（不浮在场景上），压不到格子 -->
          <div class="scene-side">
            <div class="view-clock" id="view-clock"></div>
          </div>
        </div>
        <div class="bag-panel hidden" id="bag-panel"></div>
        <!-- 技能树页签：一页一屏、靠翻页看，不上下滚动；点一个技能才在下面展开详细描述 -->
        <div class="skill-panel hidden" id="skill-panel"></div>
      </main>

      <!-- 下排：快捷区域1（装备） | 技能栏 | 快捷区域2（文字） -->
      <div class="bottom-row">

        <!-- 快捷区域1：装备栏，每个位置一个方框，可以拖动装备 / 脱下
             背包不在这儿：点视图栏的「背包」页签，背包会占满视图栏 -->
        <section class="panel quick-zone equip-zone" id="quick-zone-1" data-region="快捷区域1">
          <div class="panel-head equip-head">
            <svg class="ico" aria-hidden="true"><use href="#i-bag"></use></svg>
            <h3>装备</h3>
            <span class="grip-tag" id="equip-grip">徒手</span>
          </div>
          <div class="panel-body" id="equip-body"></div>
        </section>

        <!-- 技能栏：10 页 × 9 格，靠拖入登记（技能或背包里的物品），点一下释放 / 使用 -->
        <section class="panel move-panel skill-zone" data-region="技能栏">
          <div class="panel-head move-head skill-head">
            <svg class="ico" aria-hidden="true"><use href="#i-skills"></use></svg>
            <h3>技能</h3>
            <span class="slot-page" id="slot-page">第 1 / 10 页</span>
          </div>
          <div class="panel-body skill-slots-body" id="skill-slots-body"></div>
        </section>

        <!-- 快捷区域2：文字记录 + 指令输入 -->
        <section class="panel quick-zone text-zone" id="quick-zone-2" data-region="快捷区域2">
          <div class="panel-head text-head">
            <svg class="ico" aria-hidden="true"><use href="#i-talk"></use></svg>
            <h3>文字</h3>
          </div>
          <div class="log" id="log"></div>
          <form class="cmdline" id="cmd-form" autocomplete="off">
            <input id="cmd-input" type="text" placeholder="也可以直接输入指令，例如：说话 老张 / 继续 / 掷骰 2d6+1 / 检定 70">
            <button class="btn primary" type="submit">
              <svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg>
              <span>执行</span>
            </button>
          </form>
        </section>

      </div>
    </div>

    <!-- 右侧栏：背包快捷栏 / 休息 / 存档读档 / 系统（时钟在视图栏里，见 app.js） -->
    <aside class="panel side-right" data-region="右侧栏">
      <div class="panel-head">
        <svg class="ico" aria-hidden="true"><use href="#i-bag"></use></svg>
        <h3>行动</h3>
      </div>
      <div class="panel-body" id="action-body"></div>
    </aside>

  </div>
</section>

<!-- ========== 已退出 ========== -->
<section id="screen-exit" class="screen menu hidden">
  <div class="menu-box exit-box">
    <h1 class="title">游戏已结束</h1>
    <p class="subtitle" id="exit-text">本地服务已经关闭，进度存在 saves 文件夹里，随时可以再来。</p>
    <div class="menu-actions">
      <button class="btn big primary" id="exit-close">
        <svg class="ico" aria-hidden="true"><use href="#i-x"></use></svg>
        <span>关闭此页面</span>
      </button>
    </div>
    <p class="hint" id="exit-hint">浏览器一般不允许脚本关掉不是它自己打开的标签页；没反应的话按 Ctrl+W，或者点标签上的 ×。</p>
  </div>
</section>

<!-- ========== 技能树 / 背包 / 确认 浮层 ========== -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-title">技能树</h2>
      <button type="button" class="btn" id="modal-close" title="关闭">
        <svg class="ico" aria-hidden="true"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/app.js?v=map3"></script>
</body>
</html>
